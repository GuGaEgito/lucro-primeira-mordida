server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Chamadas da API vão para o container do back-end (serviço "backend" do docker-compose).
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Qualquer outra rota (/produtos/3, /calculos...) abre o index.html: quem cuida é o React.
  location / {
    try_files $uri /index.html;
  }
}
